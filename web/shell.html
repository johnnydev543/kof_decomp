<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kof_decomp (dev build)</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 14px/1.4 system-ui, sans-serif; }
  #wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100%; gap: 12px; }
  canvas { width: min(96vw, 1280px); aspect-ratio: 320 / 224; image-rendering: pixelated; background: #000; outline: none; }
  #status { min-height: 1.4em; }
  #keys { color: #888; font-size: 13px; text-align: center; }
  kbd { background: #222; border: 1px solid #444; border-radius: 3px; padding: 0 4px; }
  button { background: #222; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 3px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: #888; }
  #keypanel { display: none; gap: 18px; flex-wrap: wrap; justify-content: center; max-width: 96vw; }
  #keypanel.open { display: flex; }
  #keypanel table { border-collapse: collapse; }
  #keypanel td { padding: 2px 6px; }
  #keypanel td button { min-width: 90px; }
  #keypanel button.learn { border-color: #e0b040; color: #e0b040; }
  #keytools { display: flex; gap: 8px; align-items: center; }
  /* on-screen controls for touch screens */
  #touch { display: none; width: min(96vw, 1280px); justify-content: space-between; align-items: center;
           user-select: none; -webkit-user-select: none; touch-action: none; }
  #touch.on { display: flex; }
  #dpad { width: 150px; height: 150px; border-radius: 50%; background: #1c1c1c; border: 2px solid #444; position: relative; }
  #dpad::after { content: ''; position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; border-radius: 50%; background: #333; }
  #tbtns { display: grid; grid-template-columns: repeat(2, 64px); gap: 12px; }
  #tsys { display: flex; flex-direction: column; gap: 10px; }
  .tb { width: 64px; height: 64px; border-radius: 50%; border: 2px solid #555; background: #222; color: #ddd;
        font: bold 20px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .tb.small { width: 64px; height: 34px; border-radius: 8px; font-size: 13px; }
  .tb.held, #dpad.held { border-color: #e0b040; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading...</div>
  <div id="keys"></div>
  <div id="touch">
    <div id="dpad"></div>
    <div id="tsys"><div class="tb small" data-action="p1_coin">COIN</div><div class="tb small" data-action="p1_start">START</div></div>
    <div id="tbtns"><div class="tb" data-action="p1_c">C</div><div class="tb" data-action="p1_d">D</div>
                    <div class="tb" data-action="p1_a">A</div><div class="tb" data-action="p1_b">B</div></div>
  </div>
  <div id="keytools"><button id="keybtn">Key settings</button><button id="touchbtn">Touch controls</button></div>
  <div id="keypanel"></div>
</div>
<script>
  var statusEl = document.getElementById('status');
  var canvas = document.getElementById('canvas');
  canvas.addEventListener('click', function () { canvas.focus(); });
  var Module = {
    canvas: canvas,
    /* drawn with WebGL at the canvas resolution (remade sprites keep their detail); ?gpu=0 uses the CPU
       renderer, ?hd=4 the CPU renderer at 4x. Sounds come from the packed sound files (`make audio-ogg`),
       ?audio=emu runs the emulated Z80 and YM2610 instead */
    arguments: (function () {
      var q = new URLSearchParams(location.search), a = [];
      if (q.get('hd')) a.push('--hd', q.get('hd'));
      else if (q.get('gpu') !== '0') a.push('--gpu', '--scale', '4');
      if (q.get('audio') !== 'emu') a.push('--native-audio');
      if (q.get('aes') === '1') a.push('--aes');            /* home (AES) mode: mode select menu, options, no coins */
      /* the native BIOS (no BIOS ROM, quick start); ?bios=rom runs the BIOS ROM (its F2 menu); ?dip=difficulty=8,...
         sets soft DIPs (names: kof97 --soft-dip list) */
      if (q.get('bios') !== 'rom') a.push('--bios-hle', '3');
      if (q.get('dip')) a.push('--soft-dip', q.get('dip'));
      return a;
    })(),
    setStatus: function (t) { statusEl.textContent = t || 'Click the game to give it the keyboard.'; },
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); },
    /* backup RAM (soft DIPs set with F2, book keeping, records) kept in this browser */
    preRun: [function () {
      try {
        var b64 = localStorage.getItem(NVRAM_STORE);
        if (b64) FS.writeFile('/kof97.nvram', Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }));
      } catch (e) {}
    }],
    saveNvram: function (bytes) {
      try {
        var s = '';
        for (var i = 0; i < bytes.length; i += 8192) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
        localStorage.setItem(NVRAM_STORE, btoa(s));
      } catch (e) {}
    },
    onRuntimeInitialized: function () {
      runtimeReady = true;
      try { var saved = localStorage.getItem(KEY_STORE); if (saved) Module.ccall('kof_set_keys', 'number', ['string'], [saved]); } catch (e) {}
      showKeys();
      canvas.focus();
    },
    onKeyBound: function (action, ok) {        /* called by the game after kof_learn_key */
      learning = null;
      try { localStorage.setItem(KEY_STORE, Module.ccall('kof_get_keys', 'string', [], [])); } catch (e) {}
      showKeys();
      canvas.focus();
    }
  };

  /* key settings: click an action, then press the key for it (bound by the game itself, saved in this browser) */
  var KEY_STORE = 'kof97.keys', NVRAM_STORE = 'kof97.nvram', learning = null, runtimeReady = false;
  var GROUPS = [
    ['Player 1', ['p1_up', 'p1_down', 'p1_left', 'p1_right', 'p1_a', 'p1_b', 'p1_c', 'p1_d', 'p1_start', 'p1_coin']],
    ['Player 2', ['p2_up', 'p2_down', 'p2_left', 'p2_right', 'p2_a', 'p2_b', 'p2_c', 'p2_d', 'p2_start', 'p2_coin']],
    ['System', ['service', 'test']],
    ['Gamepad', ['pad_a', 'pad_b', 'pad_c', 'pad_d', 'pad_start', 'pad_coin']]
  ];
  var LABEL = { up: 'Up', down: 'Down', left: 'Left', right: 'Right', a: 'A', b: 'B', c: 'C', d: 'D',
                start: 'Start', coin: 'Coin', service: 'Service', test: 'Test' };
  function currentKeys() {
    var m = {};
    Module.ccall('kof_get_keys', 'string', [], []).split(';').forEach(function (it) {
      var i = it.indexOf('='); if (i > 0) m[it.slice(0, i)] = it.slice(i + 1);
    });
    return m;
  }
  function esc(t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function showKeys() {
    var k = currentKeys(), kb = function (a) { return '<kbd>' + esc(k[a] || '?') + '</kbd>'; };
    document.getElementById('keys').innerHTML =
      'P1 ' + ['up', 'left', 'down', 'right'].map(function (d) { return kb('p1_' + d); }).join('') + ' move, ' +
      ['a', 'b', 'c', 'd'].map(function (d) { return kb('p1_' + d); }).join('') + ' = A B C D · P2 ' +
      ['up', 'left', 'down', 'right', 'a', 'b', 'c', 'd'].map(function (d) { return kb('p2_' + d); }).join('') + ' · coin ' +
      kb('p1_coin') + '/' + kb('p2_coin') + ', start ' + kb('p1_start') + '/' + kb('p2_start') +
      ', pause <kbd>P</kbd>, reset <kbd>F3</kbd>';
    var panel = document.getElementById('keypanel'), html = '';
    GROUPS.forEach(function (g) {
      html += '<table><tr><th colspan="2">' + g[0] + '</th></tr>';
      g[1].forEach(function (a) {
        var name = LABEL[a.replace(/^(p[12]|pad)_/, '')] || a;
        html += '<tr><td>' + name + '</td><td><button data-action="' + a + '"' + (learning === a ? ' class="learn">press a key...' : '>' + esc(k[a] || '?')) + '</button></td></tr>';
      });
      html += '</table>';
    });
    html += '<div><button id="keyreset">Reset to defaults</button><br><small>Esc cancels. P, F3, F12 and Esc are reserved.<br>' +
            'Gamepad: press a button on the pad (both pads; pad 2 plays P2).</small></div>';
    panel.innerHTML = html;
  }
  document.getElementById('keybtn').addEventListener('click', function () {
    document.getElementById('keypanel').classList.toggle('open');
    canvas.focus();
  });
  document.getElementById('keypanel').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'keyreset') {
      Module.ccall('kof_set_keys', 'number', ['string'], ['default']);
      try { localStorage.removeItem(KEY_STORE); } catch (err) {}
      learning = null;
      Module.ccall('kof_learn_key', null, ['string'], [null]);
    } else {
      learning = b.dataset.action;
    if (learning.indexOf('pad_') === 0) canvas.blur();      /* keys typed now only cancel */
      Module.ccall('kof_learn_key', null, ['string'], [learning]);
    }
    showKeys();
    canvas.focus();                             /* the game reads the keyboard */
  });

  /* touch controls (shown on touch screens, or with ?touch=1 / the button): press / release game actions */
  var touchEl = document.getElementById('touch');
  function touch(action, down) { if (runtimeReady) Module.ccall('kof_touch', null, ['string', 'number'], [action, down ? 1 : 0]); }
  if (new URLSearchParams(location.search).get('touch') === '1' || matchMedia('(pointer: coarse)').matches) touchEl.classList.add('on');
  document.getElementById('touchbtn').addEventListener('click', function () { touchEl.classList.toggle('on'); canvas.focus(); });
  Array.prototype.forEach.call(document.querySelectorAll('#touch .tb'), function (el) {
    var held = {};
    function upd() { var on = Object.keys(held).length > 0; el.classList.toggle('held', on); touch(el.dataset.action, on); }
    el.addEventListener('pointerdown', function (e) { e.preventDefault(); el.setPointerCapture(e.pointerId); held[e.pointerId] = 1; upd(); });
    ['pointerup', 'pointercancel'].forEach(function (t) { el.addEventListener(t, function (e) { delete held[e.pointerId]; upd(); }); });
  });
  (function () {                                /* d-pad: direction from the centre, 8 ways */
    var pad = document.getElementById('dpad'), cur = {}, id = null;
    function set(dirs) {
      ['up', 'down', 'left', 'right'].forEach(function (d) {
        var on = dirs.indexOf(d) >= 0;
        if (!!cur[d] !== on) { cur[d] = on; touch('p1_' + d, on); }
      });
      pad.classList.toggle('held', dirs.length > 0);
    }
    function at(e) {
      var r = pad.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2;
      if (x * x + y * y < 15 * 15) return set([]);
      var a = Math.atan2(y, x) * 180 / Math.PI, d = [];         /* 0 = right, 90 = down */
      if (a > -67.5 && a < 67.5) d.push('right');
      if (a > 112.5 || a < -112.5) d.push('left');
      if (a > 22.5 && a < 157.5) d.push('down');
      if (a < -22.5 && a > -157.5) d.push('up');
      set(d);
    }
    pad.addEventListener('pointerdown', function (e) { e.preventDefault(); id = e.pointerId; pad.setPointerCapture(id); at(e); });
    pad.addEventListener('pointermove', function (e) { if (e.pointerId === id) at(e); });
    ['pointerup', 'pointercancel'].forEach(function (t) { pad.addEventListener(t, function (e) { if (e.pointerId === id) { id = null; set([]); } }); });
  })();
  /* Audio through an AudioWorklet (off the main thread) where the browser allows it: secure contexts only
     (https or localhost; a plain-http LAN address keeps SDL's ScriptProcessor). The game hands each frame's
     samples (55555 Hz stereo) to Module.audioPush; the worklet keeps up to ~150 ms and resamples linearly to
     the device rate. ?worklet=0 keeps SDL's audio. */
  (function () {
    if (!window.isSecureContext || typeof AudioWorkletNode === 'undefined' ||
        new URLSearchParams(location.search).get('worklet') === '0') return;
    var src = [
      'class KofAudio extends AudioWorkletProcessor {',
      '  constructor() { super(); this.buf = new Float32Array(65536 * 2); this.w = 0; this.r = 0; this.peak = 0; this.n = 0;',
      '    this.step = 55555 / sampleRate;',
      '    this.port.onmessage = (e) => { const d = e.data, N = 65536;',
      '      for (let i = 0; i < d.length; i += 2) { const k = (this.w % N) * 2; this.buf[k] = d[i]; this.buf[k + 1] = d[i + 1]; this.w++; }',
      '      if (this.w - this.r > 55555 * 0.15) this.r = this.w - 55555 * 0.05; }; }',
      '  process(inputs, outputs) { const L = outputs[0][0], R = outputs[0][1] || outputs[0][0], N = 65536;',
      '    for (let i = 0; i < L.length; i++) {',
      '      if (this.r + 1 >= this.w) { L[i] = R[i] = 0; continue; }',
      '      const p = Math.floor(this.r), f = this.r - p, a = (p % N) * 2, b = ((p + 1) % N) * 2;',
      '      L[i] = this.buf[a] + (this.buf[b] - this.buf[a]) * f; R[i] = this.buf[a + 1] + (this.buf[b + 1] - this.buf[a + 1]) * f;',
      '      this.peak = Math.max(this.peak, Math.abs(L[i])); this.r += this.step; }',
      '    if (++this.n % 200 === 0) { this.port.postMessage({ peak: this.peak, queued: this.w - this.r, got: this.w }); this.peak = 0; }',
      '    return true; } }',
      'registerProcessor("kof-audio", KofAudio);'].join('\n');
    var ctx = new AudioContext({ latencyHint: 'interactive' }), node = null, pending = [];
    ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: 'application/javascript' }))).then(function () {
      node = new AudioWorkletNode(ctx, 'kof-audio', { outputChannelCount: [2] });
      node.port.onmessage = function (e) { window.kofAudioStats = e.data; };   /* peak, queued and received samples */
      node.connect(ctx.destination);
      window.kofAudioNode = node;
    }).catch(function (e) { console.warn('audio worklet: ' + e); });
    window.kofAudioContext = ctx;
    Module.audioPush = function (s16) {
      if (!node) return;
      var f = new Float32Array(s16.length);
      for (var i = 0; i < s16.length; i++) f[i] = s16[i] / 32768;
      node.port.postMessage(f, [f.buffer]);
    };
  })();

  /* browsers start audio only after a user gesture */
  ['click', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () {
      if (typeof SDL2 !== 'undefined' && SDL2.audioContext && SDL2.audioContext.state === 'suspended') SDL2.audioContext.resume();
      if (window.kofAudioContext && window.kofAudioContext.state === 'suspended') window.kofAudioContext.resume();
    });
  });
</script>

</body>
</html>
